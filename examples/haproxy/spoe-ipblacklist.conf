# SPOE configuration for the IP-blacklist demo agent.
# Referenced by `filter spoe engine ipblacklist config spoe-ipblacklist.conf`
# in haproxy.cfg.
#
# For each frontend HTTP request, HAProxy sends a "check-ip" message with the
# client source address as the "ip" argument (Ipv4/Ipv6 typed data). The
# agent's set-var actions land under the "ipbl" prefix, so the agent's
# `ip_blocked` transaction variable is read here as `txn.ipbl.ip_blocked`.

[ipblacklist]
spoe-agent agents
    messages check-ip
    option var-prefix ipbl
    timeout hello      100ms
    timeout idle       30s
    timeout processing 10ms
    use-backend agents

spoe-message check-ip
    args ip=src
    event on-frontend-http-request
