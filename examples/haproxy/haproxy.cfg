# Demo HAProxy configuration for the IP-blacklist SPOA agent.
#
# Usage (paths below are relative to this directory):
#   cd examples/haproxy && haproxy -f haproxy.cfg
#
# Then `curl -i http://127.0.0.1:8080/`:
# - client IP on the agent's blacklist  -> 403 from the deny rule;
# - otherwise                           -> proxied to 127.0.0.1:8000
#   (e.g. `python3 -m http.server 8000`; a 503 is expected if nothing
#   listens there).

global
    maxconn 1024

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http-in
    bind *:8080
    filter spoe engine ipblacklist config spoe-ipblacklist.conf
    http-request deny deny_status 403 if { var(txn.ipbl.ip_blocked) -m bool }
    default_backend servers

backend servers
    server s1 127.0.0.1:8000

backend agents
    mode spop
    balance roundrobin
    server agent1 127.0.0.1:12345
